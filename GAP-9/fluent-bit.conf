[SERVICE]
    Flush          2
    Log_Level      warn
    Parsers_File   /fluent-bit/etc/parsers.conf
    storage.path   /var/lib/fluent-bit/buffer-recent

[INPUT]
    Name           tail
    Tag            cms.nginx
    Path           /host/logs/nginx/*-json.log
    Parser         docker
    DB             /var/lib/fluent-bit/nginx-recent.db
    Read_from_Head  Off
    Mem_Buf_Limit  5M
    Skip_Long_Lines On
    storage.type   filesystem

[INPUT]
    Name           tail
    Tag            cms.php-fpm
    Path           /host/logs/php-fpm/*-json.log
    Parser         docker
    DB             /var/lib/fluent-bit/php-fpm-recent.db
    Read_from_Head  Off
    Mem_Buf_Limit  5M
    Skip_Long_Lines On
    storage.type   filesystem

[INPUT]
    Name           tail
    Tag            cms.mariadb
    Path           /host/logs/mariadb/*-json.log
    Parser         docker
    DB             /var/lib/fluent-bit/mariadb-recent.db
    Read_from_Head  Off
    Mem_Buf_Limit  5M
    Skip_Long_Lines On
    storage.type   filesystem

[FILTER]
    Name           modify
    Match          cms.nginx
    Add            service_name nginx

[FILTER]
    Name           modify
    Match          cms.php-fpm
    Add            service_name php-fpm

[FILTER]
    Name           modify
    Match          cms.mariadb
    Add            service_name mariadb

[FILTER]
    Name           modify
    Match          cms.*
    Rename         log message
    Add            collector fluent-bit

[OUTPUT]
    Name           http
    Match          cms.*
    Host           data-prepper
    Port           2021
    URI            /log/ingest
    Format         json
    Json_date_key  event_time
    Json_date_format iso8601
    Header         Content-Type application/json
    Retry_Limit    False
