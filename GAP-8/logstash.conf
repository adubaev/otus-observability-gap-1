input {
  beats { port => 5044 }
}
filter {
  mutate { add_field => { "parser" => "logstash-grok" } }
  if [service][name] == "nginx" {
    grok {
      match => { "message" => '^%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:log_time}\] "%{WORD:method} %{DATA:path} HTTP/%{NUMBER:http_version}" %{INT:status:int} (?:%{INT:bytes:int}|-) "%{DATA:referrer}" "%{DATA:user_agent}"$' }
      tag_on_failure => ["parse_failed"]
    }
    if "parse_failed" not in [tags] {
      date { match => ["log_time", "dd/MMM/yyyy:HH:mm:ss Z"] locale => "en" }
      mutate { add_field => { "parse_success" => "true" } }
      mutate { convert => { "parse_success" => "boolean" } }
    }
  } else if [service][name] == "php-fpm" {
    grok { match => { "message" => '^\[%{DATA:log_time}\] %{WORD:level}: %{GREEDYDATA:event_text}$' } tag_on_failure => ["parse_failed"] }
  } else if [service][name] == "mariadb" {
    grok { match => { "message" => '^%{TIMESTAMP_ISO8601:log_time} +%{INT:thread_id:int} \[%{WORD:level}\] %{GREEDYDATA:event_text}$' } tag_on_failure => ["parse_failed"] }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "hw8-logstash-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}
