server_url: http://graylog:9000/api/
server_api_token: "${SIDECAR_API_TOKEN}"
node_id: file:/var/lib/graylog-sidecar/node-id
node_name: cms-01
update_interval: 10
send_status: true
list_log_files: []
tags: [cms]
cache_path: /var/lib/graylog-sidecar/cache
log_path: /var/log/graylog-sidecar
collector_configuration_directory: /var/lib/graylog-sidecar/generated
collector_binaries_list:
  - /usr/share/graylog-sidecar/filebeat
