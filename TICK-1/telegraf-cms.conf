[global_tags]
  site = "prod"
  role = "cms"
  collector = "app"

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  hostname = "cms-01"

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  retention_policy = "autogen"
  skip_database_creation = true
  username = "telegraf"
  password = "${INFLUXDB_PASSWORD}"

[[inputs.nginx]]
  urls = ["http://nginx:8080/stub_status"]
  response_timeout = "5s"
  [inputs.nginx.tags]
    service = "nginx"

[[inputs.phpfpm]]
  urls = ["fcgi://wordpress:9000/fpm-status"]
  timeout = "5s"
  [inputs.phpfpm.tags]
    service = "php-fpm"

[[inputs.mysql]]
  servers = ["tick_metrics:${MYSQL_METRICS_PASSWORD}@tcp(db:3306)/"]
  metric_version = 2
  gather_table_schema = false
  gather_process_list = false
  gather_slave_status = false
  [inputs.mysql.tags]
    service = "database"

[[inputs.http_response]]
  urls = ["http://nginx/"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = true
  response_status_code = 200
  [inputs.http_response.headers]
    User-Agent = "OTUS-TICK"
  [inputs.http_response.tags]
    service = "wordpress"

[[inputs.tail]]
  files = ["/var/log/nginx-cms/access.json"]
  initial_read_offset = "end"
  name_override = "nginx_access"
  path_tag = ""
  data_format = "json"
  json_string_fields = ["event_time"]
  tag_keys = ["method"]
  # Timestamp назначается при чтении каждой строки с точностью до наносекунд.
  # Исходное время nginx хранится отдельно: ISO-время с точностью до секунды
  # не должно объединять несколько запросов в одну точку InfluxDB.
  [inputs.tail.tags]
    service = "wordpress"

[[processors.converter]]
  order = 10
  namepass = ["nginx_access"]
  [processors.converter.fields]
    integer = ["status", "bytes_sent"]

# Для каждой записи лога: 1 при HTTP 500–599, иначе 0.
[[processors.starlark]]
  order = 20
  namepass = ["nginx_access"]
  source = '''
def apply(metric):
    if "status" in metric.fields:
        status = metric.fields["status"]
        metric.fields["http_5xx"] = 1 if status >= 500 and status < 600 else 0
    return metric
'''
