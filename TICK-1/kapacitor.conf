hostname = "kapacitor"
data_dir = "/var/lib/kapacitor"
default-retention-policy = "autogen"

[http]
  bind-address = ":9092"
  auth-enabled = false
  log-enabled = false

[storage]
  boltdb = "/var/lib/kapacitor/kapacitor.db"

[replay]
  dir = "/var/lib/kapacitor/replay"

[task]
  dir = "/var/lib/kapacitor/tasks"
  snapshot-interval = "60s"

[logging]
  file = "STDERR"
  level = "INFO"

[config-override]
  enabled = true

[telegram]
  enabled = false
  chat-id = "@otus_gap5"
  parse-mode = "HTML"
  global = false
  state-changes-only = true

[[influxdb]]
  enabled = true
  default = true
  name = "influxdb"
  urls = ["http://influxdb:8086"]
  startup-timeout = "5m"
  subscription-protocol = "http"
  [influxdb.subscriptions]
    telegraf = ["autogen"]
