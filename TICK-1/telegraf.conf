[global_tags]
  site = "prod"
  role = "cms"
  collector = "vm"

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  hostname = "cms-01"

[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
  database = "telegraf"
  retention_policy = "autogen"
  skip_database_creation = true
  username = "telegraf"
  password = "${INFLUXDB_PASSWORD}"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.disk]]
  # Корень VM может быть представлен как / или как точка bind mount /hostfs.
  mount_points = ["/", "/hostfs"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  interfaces = ["en*", "eth*", "wg*", "awg*"]
