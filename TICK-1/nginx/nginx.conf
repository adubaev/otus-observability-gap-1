resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

log_format tick_json escape=json
    '{"event_time":"$time_iso8601","method":"$request_method",'
    '"status":$status,"request_time":$request_time,"bytes_sent":$bytes_sent}';

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 32m;

    access_log /var/log/nginx/access.log combined;
    access_log /var/log/tick/access.json tick_json;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        set $wordpress_backend wordpress:9000;
        fastcgi_pass $wordpress_backend;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name tick.adubaev.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://tick.adubaev.ru$request_uri;
    }
}

server {
    listen 8080;
    server_name _;
    location = /stub_status {
        stub_status;
    }
}

server {
    listen 80;
    server_name grafana.adubaev.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://grafana.adubaev.ru$request_uri;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name grafana.adubaev.ru;

    ssl_certificate /etc/letsencrypt/live/grafana.adubaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.adubaev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $grafana_backend grafana:3000;
        proxy_pass http://$grafana_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name tick.adubaev.ru;

    ssl_certificate /etc/letsencrypt/live/tick.adubaev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tick.adubaev.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "OTUS TICK";
    auth_basic_user_file /etc/nginx/tick.htpasswd;

    location / {
        set $chronograf_backend tick-chronograf:8888;
        proxy_pass http://$chronograf_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
