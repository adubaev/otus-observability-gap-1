[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  wal-dir = "/var/lib/influxdb/wal"
  cache-max-memory-size = 268435456
  cache-snapshot-memory-size = 16777216

[http]
  bind-address = ":8086"
  auth-enabled = true
  log-enabled = false

[subscriber]
  enabled = true
